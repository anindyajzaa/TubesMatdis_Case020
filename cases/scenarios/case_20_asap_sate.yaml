execution_plan:
  start_node: 0      # hanya untuk test bawaan template (Dijkstra)
  goal_node: 19
  events:
    - step: 1
      type: "CONFLICT_NODE_TRIGGER"
      target_node: 9         # lokasi asap = Pasar Sore Malioboro (ID node), ganti sesuka hati
      smoke_radius_m: 300    # asap menyebar sejauh ini (meter) lewat jalan
      description: "Kepulan asap sate tebal menutup visibilitas di Pasar Sore Malioboro! Titik dalam jangkauan asap ikut berisiko bentrok, jadi slot-nya dihitung ulang."